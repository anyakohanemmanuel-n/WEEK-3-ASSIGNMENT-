<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pricing Table</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14172b;--muted:#5b6078;--line:#e2e5f0;--accent:#4f46e5;--accent-soft:#eef0ff;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#181b30;--text:#eef0ff;--muted:#a0a6c4;--line:#2b2f4d;--accent:#8b85ff;--accent-soft:#232750;--on-accent:#0f1120}}
:root[data-theme="dark"]{--bg:#0f1120;--card:#181b30;--text:#eef0ff;--muted:#a0a6c4;--line:#2b2f4d;--accent:#8b85ff;--accent-soft:#232750;--on-accent:#0f1120}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:40px 20px 56px}
h1{text-align:center;font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 8px}
.sub{text-align:center;color:var(--muted);margin:0 0 24px}
.toggle{display:flex;justify-content:center;gap:4px;margin:0 auto 36px;width:max-content;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.toggle button{border:0;background:none;color:var(--muted);padding:8px 18px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.card{position:relative;display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:28px 24px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px)}
.card.popular{border-color:var(--accent);box-shadow:0 8px 28px -12px var(--accent)}
.card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;padding:4px 14px;border-radius:999px;white-space:nowrap}
.head h2{margin:0 0 6px;font-size:1.25rem}
.head p{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.price{display:flex;align-items:baseline;gap:6px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.price .amt{font-size:2.4rem;font-weight:800}
.price .per{color:var(--muted)}
.feat{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.feat li{display:flex;gap:10px;font-size:.93rem}
.feat li::before{content:"✓";color:var(--accent);font-weight:800}
.cta{align-self:end;width:100%;padding:13px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.card.popular .cta,.card.selected .cta{background:var(--accent);color:var(--on-accent)}
.cta:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#status{text-align:center;margin-top:28px;color:var(--muted);min-height:1.5em}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:32px}}
</style>
</head>
<body>
<main>
  <h1>Simple, transparent pricing</h1>
  <p class="sub">Pick a plan. Switch billing any time.</p>
  <div class="toggle" role="group" aria-label="Billing period">
    <button type="button" data-p="month" aria-pressed="true">Monthly</button>
    <button type="button" data-p="year" aria-pressed="false">Yearly <small>(-20%)</small></button>
  </div>
  <div class="grid" id="grid"></div>
  <p id="status" aria-live="polite"></p>
</main>
<script>
var plans=[
 {id:"starter",name:"Starter",desc:"For individuals.",m:9,f:["1 project","Basic analytics","Email support"]},
 {id:"pro",name:"Pro",desc:"For growing teams that need more power, collaboration and priority help.",m:29,popular:true,f:["Unlimited projects","Advanced analytics and custom reports","Team collaboration tools","Priority support","Custom integrations"]},
 {id:"business",name:"Business",desc:"For organisations.",m:79,f:["Everything in Pro","SSO and audit logs","Dedicated manager"]}
];
var period="month",selected=null,grid=document.getElementById("grid"),status=document.getElementById("status");
function price(p){return period==="month"?p.m:Math.round(p.m*12*0.8/12)}
function render(){
 grid.innerHTML="";
 plans.forEach(function(p){
  var c=document.createElement("div");
  c.className="card"+(p.popular?" popular":"")+(selected===p.id?" selected":"");
  c.setAttribute("role","group");
  c.innerHTML=(p.popular?'<span class="badge">Most Popular</span>':'')+
   '<div class="head"><h2>'+p.name+'</h2><p>'+p.desc+'</p></div>'+
   '<div class="price"><span class="amt">$'+price(p)+'</span><span class="per">/ month'+(period==="year"?", billed yearly":"")+'</span></div>'+
   '<ul class="feat">'+p.f.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul>'+
   '<button type="button" class="cta" aria-pressed="'+(selected===p.id)+'">'+(selected===p.id?"✓ Selected":"Choose "+p.name)+'</button>';
  c.onclick=function(){selected=p.id;render();status.textContent="You selected the "+p.name+" plan at $"+price(p)+"/month.";
   var b=grid.querySelectorAll(".cta")[plans.indexOf(p)];if(b)b.focus({preventScroll:true})};
  grid.appendChild(c);
 });
}
document.querySelectorAll(".toggle button").forEach(function(b){
 b.onclick=function(){period=b.dataset.p;document.querySelectorAll(".toggle button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});render()}
});
render();
</script>
</body>
</html>
